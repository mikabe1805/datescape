# Manual trusted-backend deployment workflow. Keep this separate from Hosting:
# deploy Functions first, then rules/indexes, and only then release a dependent client.

name: Deploy Firebase backend manually

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy_backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            game-client/package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm ci --prefix game-client
      - run: npm ci --prefix functions
      - run: npm run check:ci
      - name: Authenticate Firebase CLI
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DATESCAPE_ED925 }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Firebase Functions
        run: npx firebase-tools@latest deploy --only functions --project datescape-ed925 --non-interactive
      - name: Deploy Firebase rules and indexes
        run: npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes,database,storage --project datescape-ed925 --non-interactive
