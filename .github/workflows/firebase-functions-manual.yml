# Manual functions deployment workflow.
# Keep this separate from Hosting so app releases are not blocked by IAM on Cloud Functions.

name: Deploy Firebase Functions manually

on:
  workflow_dispatch:

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefix functions
      - name: Authenticate Firebase CLI
        run: |
          cat > "$RUNNER_TEMP/firebase-service-account.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DATESCAPE_ED925 }}
          EOF
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Deploy Firebase Functions
        run: npx firebase-tools@latest deploy --only functions --project datescape-ed925 --non-interactive
